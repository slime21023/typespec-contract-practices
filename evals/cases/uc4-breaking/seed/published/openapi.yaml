openapi: 3.0.0
info:
  title: (title)
  version: 0.0.0
tags: []
paths:
  /orders:
    get:
      operationId: Orders_listOrders
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: Orders_createOrder
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
  /orders/{orderId}:
    get:
      operationId: Orders_getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    CreateOrder:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: string
    Order:
      type: object
      required:
        - id
        - status
        - total
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          type: integer
          format: int64
        legacyCode:
          type: string
    OrderStatus:
      type: string
      enum:
        - pending
        - shipped
        - delivered
